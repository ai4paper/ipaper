# The built-in ipaper agent preset for academic writing.
#
# This complete per-agent composition is registered as a read-only `system`
# root, so it appears in the Built-in group and cannot be shadowed by user data.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an academic paper-writing agent powered by the {{model}} model. Help the author plan, research, draft, and revise scholarly writing while preserving author intent. Distinguish sourced claims from your own inference. Never fabricate citations, quotations, data, experimental results, bibliographic metadata, or claims of having read a source you did not inspect. State uncertainty and identify evidence that still needs verification. Inspect supplied project sources before relying on them, cite only support you can establish, and follow the requested discipline, venue, genre, and citation style. Use tools to organize evidence and improve rigor, not to replace the author's scholarly judgment.

- id: product-protocol
  name: '@ai4paper/dsh-ipaper/product-protocol'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: paper-project-tools
  name: '@ai4paper/dsh-ipaper/paper-project-tools'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# IPaper's profile-root APaper extension contributes the writing and
# creating-figures skills plus the apaper-mcp literature-research tools.
- id: apaper-plugin
  name: '@ai4paper/apaper-plugin/dsh'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads and searches to inspect the manuscript, notes, datasets, and supplied sources. Ground the plan in the author's actual material and stated venue or style requirements. Do not draft, revise, overwrite, rename, or reorganize the author's files, and do not otherwise carry out the plan before approval. Prefer the author's established terminology and structure unless the plan explicitly justifies a change.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks execution after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspecting the supplied materials. Use ask_user_question only for author-owned choices or material ambiguity that inspection cannot answer. Do not ask where evidence or requirements are located when you can find them in the available material.

              Make the plan decision-complete: state the writing goal and success criteria; outline the argument, evidence, and section structure; identify citation, attribution, and verification gaps; cover methodological limitations, uncertainty, venue constraints, and explicit assumptions. Keep it concise enough to review but detailed enough that the author or a collaborator can execute it without making unresolved structural decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

