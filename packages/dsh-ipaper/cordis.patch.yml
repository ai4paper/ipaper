# Product overlay after @deepseek-ai/dsh-web-app. Upstream owns the standard
# host/browser roster, startup flags, transport trust, and frontend shell.
- id: system-prompt
  config:
    personaPrefix: >-
      You are an academic paper-writing agent powered by the {{model}} model. Help the author plan, research, draft, and revise scholarly work while preserving author intent and source integrity.

- id: agent-preset-registry
  config:
    default: ipaper

# Connection's rc.1 custom-channel registrar reads its provider's webServer.
- id: connection
  inject: [webStartup, webServer]

# Only the academic composition and explicitly authored user presets are offered.
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-ptc
  disabled: true
- id: ui-brand-official
  disabled: true

- insert:
    # Keep the upstream connection row for browser-module discovery.
    - id: ipaper-connection
      name: '@ai4paper/dsh-ipaper/connection'
      inject: [connection]
      config:
        browserAuth:
          enabled: true

    - id: ipaper-brand
      name: '@ai4paper/dsh-ipaper'
      inject: [webServer]

    - id: paper-project
      name: '@ai4paper/dsh-ipaper/paper-project'
      inject: [storageDomain, workspaceRegistry, agents]

    - id: academic-writing-preset
      name: '@ai4paper/dsh-ipaper/academic-writing-preset'
      inject: [agentPresets, paperProjects]

    - id: paper-project-remote
      name: '@ai4paper/dsh-ipaper/paper-project-remote'
      inject: [connection, paperProjects, webServer]
