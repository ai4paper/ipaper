name: Validate and publish IPaper

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @ai4paper/dsh-ipaper pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Inspect tarball
        run: |
          tarball=(dist/ai4paper-dsh-ipaper-*.tgz)
          test "${#tarball[@]}" -eq 1
          tar -tzf "${tarball[0]}" | tee dist/contents.txt
          grep -q 'package/lib/web/index.html' dist/contents.txt
          grep -q 'package/lib/clients/ui-brand-ipaper/client.js' dist/contents.txt
          grep -q 'package/preset/ipaper/agent.cordis.yml' dist/contents.txt
          ! grep -q 'package/src/' dist/contents.txt
          ! grep -q 'package/lib/clients/ui-conversation/' dist/contents.txt
          mkdir dist/extracted
          tar -xzf "${tarball[0]}" -C dist/extracted
          node scripts/validate-package.mjs dist/extracted/package
          rm -rf dist/extracted
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ipaper
          path: dist/*
      - name: Publish product tarball only
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish ./dist/ai4paper-dsh-ipaper-*.tgz --provenance --access public
