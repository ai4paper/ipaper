packages:
  - packages/*

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  node-pty: true
  '@google/genai': false
  esbuild: true
  koffi: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

# APaper's DSH adapter must share the profile's runtime service identities.
overrides:
  '@ai4paper/apaper-plugin@0.2.3>@deepseek-ai/dsh-mcp-client': 0.2.2-rc.1
